<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f5c45">
    <title>Cadastro de Usuários</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Cadastro de Personagens</h1>
        <p>Gerencie personagens de Jujutsu Kaisen</p>
      </div>
    </header>

    <main class="container">
      <section class="painel">
        <h2 id="titulo-formulario">Novo personagem</h2>

        <form id="form-personagem">
          <input type="hidden" id="personagem-id">

          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" required>

          <label for="categoria">Categoria</label>
          <input id="categoria" name="categoria" type="text" placeholder="Ex:Feiticeiro" required>

          <label for="tecnica">Tecnica</label>
          <input id="tecnica" name="tecnica" type="text" placeholder="Ex:Limitless">

          <div class="acoes-formulario">
            <button type="submit" id="botao-salvar">Cadastrar</button>
            <button type="button" id="botao-cancelar" class="secundario oculto">
              Cancelar edição
            </button>
          </div>
        </form>
      </section>

      <!-- lista dos char -->
      <section class="painel">
        <div class="cabecalho-lista">
          <h2>Personagens</h2>
          <button type="button" id="botao-atualizar" class="secundario">Atualizar lista</button>
        </div>
        
        <!-- buca por id -->
        <form id="form-busca" class="busca">
          <label for="busca-id">Buscar personagem pelo ID</label>
          <div class="linha-busca">
            <input id="busca-id" type="text" placeholder="Informe o ID do personagem">
            <button type="submit">Buscar</button>
            <button type="button" id="botao-limpar-busca" class="secundario">Listar todos</button>
          </div>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>
        <div id="lista-personagens" class="lista-personagens"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
